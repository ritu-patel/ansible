---
- name: Ask IT v2 demo isolate endpoint
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    hostname: "{{ hostname | default('unknown-host') }}"
    reason: "{{ reason | default('security_event') }}"
    notify: "{{ notify | default('true') }}"
    audit_log_path: "/var/log/nt-it-automation/isolate_endpoint.log"

  tasks:
    - name: Validate endpoint isolation request
      ansible.builtin.assert:
        that:
          - hostname | length > 0
          - reason | length > 0
        fail_msg: "hostname and reason are required for endpoint isolation"
        success_msg: "Validated endpoint isolation request for {{ hostname }}"

    - name: Simulate network isolation action
      ansible.builtin.debug:
        msg: |
          Isolation action:
          Hostname: {{ hostname }}
          Reason: {{ reason }}
          Notify SOC: {{ notify }}
          Action taken: device moved to quarantine network segment

    - name: Simulate security follow-up
      ansible.builtin.debug:
        msg: |
          Security follow-up:
          EDR containment enabled
          Remote access disabled except IR tools
          Status: ENDPOINT ISOLATED

    - name: Write endpoint isolation audit log
      ansible.builtin.lineinfile:
        path: "{{ audit_log_path }}"
        line: >
          {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}
          | ISOLATE_ENDPOINT | hostname={{ hostname }} | reason={{ reason }}
          | notify={{ notify }} | performed_by=ask_it_v2 | status=SUCCESS
        create: true
        mode: '0640'
      ignore_errors: true

    - name: Display endpoint isolation summary
      ansible.builtin.debug:
        msg:
          - "ENDPOINT ISOLATION COMPLETED"
          - "Hostname: {{ hostname }}"
          - "Reason: {{ reason }}"
          - "SOC notified: {{ notify }}"
          - "Status: ISOLATED"

