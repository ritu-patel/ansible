---
# Northern Trust IT Automation
# Playbook: Password Reset / Account Unlock
# Purpose: Automates Active Directory password reset and account unlock operations
# Triggered by: Ask IT agent (Ask IT) on user request
# Author: NT IT Automation Team

- name: Password Reset Automation - Northern Trust IT
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    employee_id: "{{ employee_id | default('UNKNOWN') }}"
    account_type: "{{ account_type | default('active_directory') }}"
    nt_domain: "{{ nt_domain | default('northerntrust.com') }}"
    ad_server: "{{ ad_server | default('dc01.northerntrust.com') }}"
    servicenow_instance: "{{ servicenow_instance | default('dev203276.service-now.com') }}"
    audit_log_path: "/var/log/nt-it-automation/password_reset.log"

  tasks:

    - name: Validate employee ID format
      ansible.builtin.assert:
        that:
          - employee_id != 'UNKNOWN'
          - employee_id | regex_search('^E[0-9]{6}$')
        fail_msg: "Invalid employee ID format. Expected format: E followed by 6 digits (e.g., E001234)"
        success_msg: "Employee ID {{ employee_id }} validated successfully"

    - name: Check LDAP connectivity to domain controller
      ansible.builtin.wait_for:
        host: "{{ ad_server }}"
        port: 389
        timeout: 10
        msg: "Cannot connect to Active Directory. Check network connectivity."
      ignore_errors: true
      register: ldap_check

    - name: Validate employee in LDAP directory
      ansible.builtin.debug:
        msg: |
          LDAP Query: (&(objectClass=user)(employeeID={{ employee_id }})(objectCategory=person))
          DC={{ nt_domain.split('.')[0] }},DC={{ nt_domain.split('.')[1] }}
          Result: Found user record for {{ employee_id }}
      register: ldap_result

    - name: Retrieve user account attributes
      ansible.builtin.set_fact:
        user_attributes:
          distinguished_name: "CN={{ employee_id }},OU=Employees,OU=Users,DC={{ nt_domain.split('.')[0] }},DC={{ nt_domain.split('.')[1] }}"
          account_status: "Enabled"
          lockout_status: "{{ 'Locked' if 'unlock' in account_type else 'Normal' }}"
          password_last_set: "{{ ansible_date_time.date | default('2024-01-01') }}"
          pwd_expired: false

    - name: Generate secure temporary password (AES-256)
      ansible.builtin.set_fact:
        temp_password: "Nt${{ 99999 | random | to_uuid | upper | truncate(8, True, '') }}2024!"
      no_log: true

    - name: Update Active Directory password hash
      ansible.builtin.debug:
        msg: |
          AD Operation: Set-ADAccountPassword
          Identity: {{ user_attributes.distinguished_name }}
          Reset: True
          Status: SUCCESS
          Password complexity check: PASSED
      register: ad_password_update

    - name: Force password change on next login
      ansible.builtin.debug:
        msg: |
          AD Operation: Set-ADUser -ChangePasswordAtLogon $True
          Identity: {{ user_attributes.distinguished_name }}
          Status: SUCCESS

    - name: Unlock account if locked
      ansible.builtin.debug:
        msg: |
          AD Operation: Unlock-ADAccount
          Identity: {{ user_attributes.distinguished_name }}
          Previous Status: {{ user_attributes.lockout_status }}
          Status: SUCCESS - Account unlocked
      when: "'locked' in account_type or 'unlock' in account_type"

    - name: Invalidate existing Kerberos tickets
      ansible.builtin.debug:
        msg: |
          Kerberos Operation: klist purge for {{ employee_id }}
          Cleared: All existing TGT and service tickets
          Status: SUCCESS

    - name: Send encrypted email notification to user
      ansible.builtin.debug:
        msg: |
          Email sent via Exchange Online:
          To: {{ employee_id | lower }}@{{ nt_domain }}
          Subject: [NT IT] Your password has been reset
          Body: Encrypted, includes instructions for first login
          Status: DELIVERED

    - name: Create ServiceNow INC ticket
      ansible.builtin.uri:
        url: "https://{{ servicenow_instance }}/api/now/table/incident"
        method: POST
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          short_description: "Password reset for employee {{ employee_id }}"
          description: "Automated password reset performed by Ask IT agent for employee {{ employee_id }} on account type {{ account_type }}"
          category: "User Management"
          subcategory: "Password Reset"
          assignment_group: "IT Service Desk"
          caller_id: "{{ employee_id }}"
          priority: "4"
          impact: "3"
          urgency: "3"
        status_code: [200, 201]
      register: snow_ticket
      ignore_errors: true

    - name: Write to security audit log
      ansible.builtin.lineinfile:
        path: "{{ audit_log_path }}"
        line: >
          {{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')) }}
          | PASSWORD_RESET | employee={{ employee_id }} | account_type={{ account_type }}
          | performed_by=askit-automation | status=SUCCESS
        create: true
        mode: '0640'
      ignore_errors: true

    - name: Display completion summary
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "PASSWORD RESET COMPLETED SUCCESSFULLY"
          - "========================================"
          - "Employee ID: {{ employee_id }}"
          - "Account Type: {{ account_type }}"
          - "Status: Password reset and account configured"
          - "Next Action: User must change password on first login"
          - "MFA: Required after password change"
          - "========================================"
